{% extends "admin/base.html" %}
{% block title %}Password{% endblock %}
{% block body %}
<h1>Change password</h1>
<form class="panel narrow" method="post">
  {% if err %}<div class="flash error" role="alert">{{ err }}</div>{% endif %}
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="c">Current password</label><input id="c" name="current" type="password" autocomplete="current-password" required>
  <label for="p">New password</label><input id="p" name="password" type="password" autocomplete="new-password" required><p class="hint">At least 8 characters.</p>
  <label for="p2">Repeat new password</label><input id="p2" name="password2" type="password" autocomplete="new-password" required>
  <button class="btn" type="submit">Change password</button>
</form>
{% endblock %}
